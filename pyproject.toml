[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smeshlite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
render = ["pygame>=2.5"]
train  = ["stable-baselines3>=2.0", "tqdm"]
tracking = ["mlflow>=3.0"]
dev    = ["pytest>=8.0", "ipykernel", "nbformat>=5.10", "nbclient>=0.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smeshlite*"]
